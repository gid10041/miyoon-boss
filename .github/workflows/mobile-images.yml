name: Make mobile images

on:
  push:
    paths:
      - 'img/**/*.png'
      - 'make_mobile_images.py'
  workflow_dispatch:   # 필요할 때 GitHub 화면에서 수동 실행도 가능

permissions:
  contents: write      # 변환 결과를 저장소에 커밋하려면 필요

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow 설치
        run: pip install pillow

      - name: 모바일용 그림 만들기
        run: python make_mobile_images.py

      - name: 변경된 결과만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/m
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "모바일용 그림 자동 생성 [skip ci]"
            git push
          fi
